<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Neon Invaders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --bg:#05040f; --fg:#e8f6ff; --accent:#4fe3ff; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:"Press Start 2P",monospace; overflow:hidden; touch-action:none; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:16px; }
  #wrap { width:min(480px, 100%, calc((100vh - 110px) * 0.75)); }
  canvas { display:block; width:100%; aspect-ratio:3/4; border:2px solid #1d1a3a; border-radius:8px;
    box-shadow:0 0 40px rgba(79,227,255,.15); background:#05040f; image-rendering:pixelated; }
  #help { font-size:9px; color:#7f7aa8; text-align:center; line-height:1.8; }
  #touch { display:none; width:100%; gap:10px; margin-top:10px; }
  #touch button { flex:1; height:60px; font:inherit; font-size:14px; color:var(--fg);
    background:#141130; border:2px solid #2c2760; border-radius:10px; user-select:none; -webkit-user-select:none; }
  #touch button:active, #touch button.on { background:#2c2760; border-color:var(--accent); }
  #touch .fire { flex:1.4; color:#ff4fd8; }
  @media (pointer:coarse) { #touch { display:flex; } #help { display:none; } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="480" height="640"></canvas>
  <div id="touch">
    <button data-k="left">◀</button>
    <button data-k="fire" class="fire">FIRE</button>
    <button data-k="right">▶</button>
  </div>
</div>
<div id="help">← → / A D : 이동 &nbsp; SPACE : 발사 &nbsp; P : 일시정지 &nbsp; ENTER : 시작</div>

<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const GROUND = H - 36;
const COL = ['#9dff4f', '#4fe3ff', '#ff4fd8'];
const PTS = [10, 20, 30];
const FONT = '"Press Start 2P", monospace';

let state = 'title', paused = false;
let score = 0, hi = 0, lives = 3, level = 1, t = 0;
let player, pBullets = [], eBullets = [], aliens = [], shields = [], particles = [], texts = [];
let ufo = null, grid = { dir: 1, frame: 0, frameT: 0, note: 0 };
let shake = 0, levelTimer = 0, overTimer = 0;
const keys = {};

try { hi = +localStorage.getItem('neonInvHi') || 0; } catch (e) {}
function saveHi() { try { localStorage.setItem('neonInvHi', hi); } catch (e) {} }

const stars = Array.from({ length: 90 }, () => ({
  x: Math.random() * W, y: Math.random() * H, s: Math.random() * 1.6 + 0.3, v: Math.random() * 25 + 8
}));

/* ---------- 사운드 (WebAudio) ---------- */
let ac;
function snd(f, d = 0.1, type = 'square', v = 0.06, f2) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(), n = ac.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, n);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, n + d);
    g.gain.setValueAtTime(v, n); g.gain.exponentialRampToValueAtTime(0.0001, n + d);
    o.connect(g).connect(ac.destination); o.start(n); o.stop(n + d);
  } catch (e) {}
}
function noise(d = 0.3, v = 0.15) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const len = ac.sampleRate * d, buf = ac.createBuffer(1, len, ac.sampleRate), data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = ac.createBufferSource(), g = ac.createGain();
    s.buffer = buf; g.gain.value = v; s.connect(g).connect(ac.destination); s.start();
  } catch (e) {}
}

/* ---------- 유틸 ---------- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const overlap = (ax, ay, aw, ah, bx, by, bw, bh) => ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;

function burst(x, y, col, n = 14, sp = 160) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = Math.random() * sp;
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.4 + Math.random() * 0.5, max: 0.9, col, s: Math.random() * 3 + 1 });
  }
}
function popText(x, y, s, col = '#fff') { texts.push({ x, y, s, col, life: 1.2 }); }

/* ---------- 레벨 구성 ---------- */
function makeShields() {
  const cells = [], cs = 4, cw = 12, ch = 8;
  for (let i = 0; i < 4; i++) {
    const bx = 56 + i * (W - 112 - cw * cs) / 3, by = H - 140;
    for (let r = 0; r < ch; r++) for (let c = 0; c < cw; c++) {
      if (r < 2 && (c < 2 - r || c > cw - 3 + r)) continue;   // 위쪽 모서리 깎기
      if (r >= 5 && c >= 4 && c <= 7) continue;               // 아래 홈
      cells.push({ x: bx + c * cs, y: by + r * cs, alive: true });
    }
  }
  return cells;
}

function newLevel() {
  aliens = [];
  const drop = Math.min(level - 1, 6) * 10;
  for (let r = 0; r < 5; r++) for (let c = 0; c < 10; c++) {
    const type = r === 0 ? 2 : r < 3 ? 1 : 0;
    aliens.push({ x: 40 + c * 38, y: 70 + r * 34 + drop, w: 28, h: 22, type, alive: true, col: c });
  }
  grid = { dir: 1, frame: 0, frameT: 0, note: 0 };
  pBullets = []; eBullets = []; ufo = null;
  shields = makeShields();
  player.x = W / 2;
}

function startGame() {
  score = 0; lives = 3; level = 1; paused = false;
  player = { x: W / 2, y: H - 56, w: 34, h: 18, speed: 250, cd: 0, inv: 1.5, dead: 0 };
  particles = []; texts = [];
  newLevel();
  state = 'play';
  snd(440, 0.1); setTimeout(() => snd(660, 0.1), 100); setTimeout(() => snd(880, 0.15), 200);
}

function gameOver() {
  state = 'over'; overTimer = 1;
  if (score >= hi) { hi = score; saveHi(); }
  snd(300, 0.6, 'sawtooth', 0.08, 60);
}

function hitShield(bx, by, bw, bh) {
  for (const s of shields) {
    if (s.alive && overlap(bx, by, bw, bh, s.x, s.y, 4, 4)) {
      for (const o of shields)
        if (o.alive && Math.abs(o.x - s.x) <= 6 && Math.abs(o.y - s.y) <= 6 && Math.random() < 0.6) o.alive = false;
      s.alive = false;
      burst(s.x + 2, s.y + 2, '#7fffd4', 5, 80);
      return true;
    }
  }
  return false;
}

function hitPlayer() {
  const p = player;
  lives--; p.dead = 1.4; shake = 0.4;
  burst(p.x, p.y, '#4fe3ff', 40, 240); burst(p.x, p.y, '#fff', 20, 120);
  noise(0.5, 0.25); snd(200, 0.5, 'sawtooth', 0.06, 40);
  eBullets = [];
}

/* ---------- 업데이트 ---------- */
function update(dt) {
  t += dt;
  for (const s of stars) { s.y += s.v * dt; if (s.y > H) { s.y = 0; s.x = Math.random() * W; } }
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  for (const tx of texts) { tx.y -= 30 * dt; tx.life -= dt; }
  texts = texts.filter(tx => tx.life > 0);
  if (shake > 0) shake -= dt;
  if (overTimer > 0) overTimer -= dt;

  if (state === 'clear') {
    levelTimer -= dt;
    if (levelTimer <= 0) { level++; newLevel(); state = 'play'; player.inv = 1.5; }
    return;
  }
  if (state !== 'play' || paused) return;

  const p = player;

  // 플레이어
  if (p.dead > 0) {
    p.dead -= dt;
    if (p.dead <= 0) {
      if (lives <= 0) { gameOver(); return; }
      p.inv = 2; p.x = W / 2;
    }
  } else {
    const mv = (keys.left ? -1 : 0) + (keys.right ? 1 : 0);
    p.x = clamp(p.x + mv * p.speed * dt, p.w / 2 + 8, W - p.w / 2 - 8);
    p.cd -= dt;
    if (keys.fire && p.cd <= 0 && pBullets.length < 2) {
      pBullets.push({ x: p.x, y: p.y - 14 });
      p.cd = 0.3;
      snd(1200, 0.09, 'square', 0.04, 400);
    }
    if (p.inv > 0) p.inv -= dt;
  }

  // 외계인 이동
  const alive = aliens.filter(a => a.alive);
  if (!alive.length) {
    state = 'clear'; levelTimer = 2.2; pBullets = []; eBullets = [];
    [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => snd(f, 0.15, 'triangle', 0.08), i * 120));
    return;
  }
  const speed = (18 + (50 - alive.length) * 3.4) * (1 + (level - 1) * 0.15);
  let minX = Infinity, maxX = -Infinity, maxY = 0;
  for (const a of alive) { minX = Math.min(minX, a.x); maxX = Math.max(maxX, a.x + a.w); maxY = Math.max(maxY, a.y + a.h); }
  if ((grid.dir > 0 && maxX >= W - 10) || (grid.dir < 0 && minX <= 10)) {
    grid.dir *= -1;
    for (const a of alive) a.y += 14;
  } else {
    for (const a of alive) a.x += grid.dir * speed * dt;
  }

  // 행진 애니메이션 + 박자음
  grid.frameT += dt;
  const interval = Math.max(0.07, 0.55 * alive.length / 50);
  if (grid.frameT >= interval) {
    grid.frameT = 0; grid.frame ^= 1;
    snd([98, 87, 78, 73][grid.note++ % 4], 0.08, 'square', 0.05);
  }

  // 외계인과 방어막 충돌 / 침공 체크
  for (const a of alive) {
    if (a.y + a.h > H - 145) for (const s of shields) if (s.alive && overlap(a.x, a.y, a.w, a.h, s.x, s.y, 4, 4)) s.alive = false;
    if (a.y + a.h >= p.y - 10) { burst(p.x, p.y, '#4fe3ff', 40, 240); lives = 0; gameOver(); return; }
  }

  // 외계인 사격 (각 열의 맨 아래 외계인)
  if (p.dead <= 0 && Math.random() < (0.7 + level * 0.3) * dt && eBullets.length < 3 + level) {
    const shooter = alive[Math.floor(Math.random() * alive.length)];
    let bottom = shooter;
    for (const a of alive) if (a.col === shooter.col && a.y > bottom.y) bottom = a;
    eBullets.push({ x: bottom.x + bottom.w / 2, y: bottom.y + bottom.h, vy: 170 + level * 15 + Math.random() * 40 });
  }

  // UFO
  if (!ufo && Math.random() < dt / 16 && maxY > 120) {
    const d = Math.random() < 0.5 ? 1 : -1;
    ufo = { x: d > 0 ? -44 : W + 4, y: 38, w: 40, h: 16, dir: d };
  }
  if (ufo) {
    ufo.x += ufo.dir * 110 * dt;
    if (Math.floor(t * 8) % 2) snd(ufo.dir > 0 ? 600 : 520, 0.03, 'sine', 0.025);
    if (ufo.x < -60 || ufo.x > W + 60) ufo = null;
  }

  // 플레이어 탄
  for (const b of pBullets) {
    b.y -= 560 * dt;
    if (b.y < 20) { b.dead = true; continue; }
    if (hitShield(b.x - 1.5, b.y - 6, 3, 12)) { b.dead = true; continue; }
    for (const a of alive) {
      if (a.alive && overlap(b.x - 1.5, b.y - 6, 3, 12, a.x, a.y, a.w, a.h)) {
        a.alive = false; b.dead = true;
        score += PTS[a.type];
        burst(a.x + a.w / 2, a.y + a.h / 2, COL[a.type], 18);
        noise(0.15, 0.1); snd(400, 0.12, 'square', 0.04, 80);
        break;
      }
    }
    if (!b.dead && ufo && overlap(b.x - 1.5, b.y - 6, 3, 12, ufo.x, ufo.y, ufo.w, ufo.h)) {
      const bonus = [50, 100, 150, 300][Math.floor(Math.random() * 4)];
      score += bonus; b.dead = true;
      burst(ufo.x + 20, ufo.y + 8, '#ffb84f', 30, 220);
      popText(ufo.x + 20, ufo.y + 8, bonus, '#ffb84f');
      snd(900, 0.4, 'triangle', 0.08, 200);
      ufo = null;
    }
    if (!b.dead) for (const e of eBullets) {
      if (!e.dead && Math.abs(e.x - b.x) < 6 && Math.abs(e.y - b.y) < 12) {
        e.dead = b.dead = true; burst(b.x, b.y, '#fff', 8, 100); break;
      }
    }
  }
  pBullets = pBullets.filter(b => !b.dead);

  // 적 탄
  for (const e of eBullets) {
    if (e.dead) continue;
    e.y += e.vy * dt;
    if (e.y > GROUND) { e.dead = true; burst(e.x, GROUND, '#ff4fd8', 5, 60); continue; }
    if (hitShield(e.x - 2, e.y - 6, 4, 12)) { e.dead = true; continue; }
    if (p.dead <= 0 && p.inv <= 0 && overlap(e.x - 2, e.y - 6, 4, 12, p.x - p.w / 2, p.y - 12, p.w, p.h + 6)) {
      e.dead = true; hitPlayer(); break;
    }
  }
  eBullets = eBullets.filter(e => !e.dead);

  if (score > hi) hi = score;
}

/* ---------- 그리기 ---------- */
function glow(c, b = 12) { ctx.shadowColor = c; ctx.shadowBlur = b; }
function noGlow() { ctx.shadowBlur = 0; }

function drawAlien(type, x, y, f) {
  const cx = x + 14, cy = y + 11, c = COL[type];
  ctx.fillStyle = c; glow(c);
  ctx.beginPath();
  if (type === 0) {            // 돔 크롤러
    ctx.arc(cx, cy + 3, 11, Math.PI, 0);
    ctx.lineTo(cx + 11, cy + 6); ctx.lineTo(cx - 11, cy + 6); ctx.closePath(); ctx.fill();
    ctx.fillRect(cx - 11, cy + 6, 4, f ? 6 : 3);
    ctx.fillRect(cx - 2, cy + 6, 4, f ? 3 : 6);
    ctx.fillRect(cx + 7, cy + 6, 4, f ? 6 : 3);
    noGlow(); ctx.fillStyle = '#0a0820';
    ctx.fillRect(cx - 6, cy - 2, 4, 4); ctx.fillRect(cx + 2, cy - 2, 4, 4);
  } else if (type === 1) {     // 날개 드론
    ctx.moveTo(cx, cy - 10); ctx.lineTo(cx + 6, cy); ctx.lineTo(cx, cy + 10); ctx.lineTo(cx - 6, cy); ctx.closePath(); ctx.fill();
    const wy = f ? -8 : 6;
    ctx.beginPath(); ctx.moveTo(cx + 4, cy - 2); ctx.lineTo(cx + 14, cy + wy); ctx.lineTo(cx + 5, cy + 4); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx - 4, cy - 2); ctx.lineTo(cx - 14, cy + wy); ctx.lineTo(cx - 5, cy + 4); ctx.closePath(); ctx.fill();
    noGlow(); ctx.fillStyle = '#0a0820';
    ctx.beginPath(); ctx.arc(cx, cy, 2.5, 0, Math.PI * 2); ctx.fill();
  } else {                     // 외눈 헥사
    for (let i = 0; i < 6; i++) {
      const a = Math.PI / 6 + i * Math.PI / 3;
      ctx.lineTo(cx + Math.cos(a) * 11, cy + Math.sin(a) * 10);
    }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = c; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx - 5, cy - 9); ctx.lineTo(cx - 8, cy - (f ? 15 : 13));
    ctx.moveTo(cx + 5, cy - 9); ctx.lineTo(cx + 8, cy - (f ? 13 : 15));
    ctx.stroke();
    noGlow(); ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(cx, cy, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#0a0820';
    ctx.beginPath(); ctx.arc(cx + (f ? -2 : 2), cy, 2.5, 0, Math.PI * 2); ctx.fill();
  }
  noGlow();
}

function drawShip(x, y, s = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = '#e8f6ff'; glow('#4fe3ff', 14);
  ctx.beginPath();
  ctx.moveTo(0, -14); ctx.lineTo(6, -4); ctx.lineTo(17, 2); ctx.lineTo(17, 8);
  ctx.lineTo(-17, 8); ctx.lineTo(-17, 2); ctx.lineTo(-6, -4); ctx.closePath(); ctx.fill();
  noGlow(); ctx.fillStyle = '#4fe3ff';
  ctx.fillRect(-2, -8, 4, 6);
  ctx.fillStyle = '#ff4fd8';
  ctx.fillRect(-14, 8, 5, 2 + (Math.floor(t * 20) % 2) * 2);
  ctx.fillRect(9, 8, 5, 2 + (Math.floor(t * 20 + 1) % 2) * 2);
  ctx.restore();
}

function drawUfo(u) {
  const cx = u.x + 20, cy = u.y + 8;
  ctx.fillStyle = '#ffb84f'; glow('#ffb84f', 16);
  ctx.beginPath(); ctx.ellipse(cx, cy + 2, 20, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx, cy - 2, 9, 7, 0, Math.PI, 0); ctx.fill();
  noGlow();
  for (let i = -2; i <= 2; i++) {
    ctx.fillStyle = (Math.floor(t * 10) + i) % 2 ? '#fff' : '#5a2a00';
    ctx.fillRect(cx + i * 7 - 1.5, cy + 1, 3, 3);
  }
}

function centerText(s, y, size, col = '#e8f6ff', g) {
  ctx.font = `${size}px ${FONT}`; ctx.textAlign = 'center'; ctx.fillStyle = col;
  if (g) glow(g, 18);
  ctx.fillText(s, W / 2, y);
  noGlow();
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * 14 * shake, (Math.random() - 0.5) * 14 * shake);

  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#05040f'); bg.addColorStop(1, '#120a2a');
  ctx.fillStyle = bg; ctx.fillRect(-10, -10, W + 20, H + 20);

  for (const s of stars) {
    ctx.fillStyle = `rgba(200,210,255,${0.3 + s.s * 0.35})`;
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }

  if (state !== 'title') {
    // 지면
    ctx.fillStyle = '#4fe3ff'; glow('#4fe3ff', 8);
    ctx.fillRect(0, GROUND, W, 2); noGlow();

    // 방어막
    ctx.fillStyle = '#3ee8b0';
    for (const s of shields) if (s.alive) ctx.fillRect(s.x, s.y, 4, 4);

    for (const a of aliens) if (a.alive) drawAlien(a.type, a.x, a.y, grid.frame);
    if (ufo) drawUfo(ufo);

    // 플레이어
    const p = player;
    if (p.dead <= 0 && !(p.inv > 0 && Math.floor(t * 12) % 2)) drawShip(p.x, p.y);

    // 탄
    ctx.fillStyle = '#fff'; glow('#4fe3ff', 10);
    for (const b of pBullets) ctx.fillRect(b.x - 1.5, b.y - 7, 3, 14);
    ctx.strokeStyle = '#ff4fd8'; ctx.lineWidth = 2; glow('#ff4fd8', 10);
    for (const e of eBullets) {
      const z = Math.floor(t * 16) % 2 ? 3 : -3;
      ctx.beginPath();
      ctx.moveTo(e.x, e.y - 7); ctx.lineTo(e.x + z, e.y - 3); ctx.lineTo(e.x - z, e.y + 1); ctx.lineTo(e.x + z, e.y + 5);
      ctx.stroke();
    }
    noGlow();
  }

  // 파티클
  for (const pt of particles) {
    ctx.globalAlpha = clamp(pt.life / 0.6, 0, 1);
    ctx.fillStyle = pt.col; ctx.fillRect(pt.x, pt.y, pt.s, pt.s);
  }
  ctx.globalAlpha = 1;
  for (const tx of texts) {
    ctx.globalAlpha = clamp(tx.life, 0, 1);
    ctx.font = `10px ${FONT}`; ctx.textAlign = 'center'; ctx.fillStyle = tx.col;
    ctx.fillText(tx.s, tx.x, tx.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // HUD
  ctx.font = `10px ${FONT}`; ctx.textAlign = 'left'; ctx.fillStyle = '#7f7aa8';
  ctx.fillText('SCORE', 14, 18); ctx.fillText('HI', W / 2 - 20, 18);
  ctx.textAlign = 'right'; ctx.fillText('LV', W - 14, 18);
  ctx.font = `12px ${FONT}`; ctx.fillStyle = '#e8f6ff';
  ctx.textAlign = 'left'; ctx.fillText(String(score).padStart(5, '0'), 14, 34);
  ctx.fillText(String(hi).padStart(5, '0'), W / 2 - 20, 34);
  ctx.textAlign = 'right'; ctx.fillText(level, W - 14, 34);

  if (state !== 'title') {
    for (let i = 0; i < Math.max(0, lives - (player.dead > 0 ? 0 : 1)); i++) drawShip(26 + i * 30, H - 16, 0.6);
    ctx.font = `10px ${FONT}`; ctx.textAlign = 'right'; ctx.fillStyle = '#7f7aa8';
    ctx.fillText(`LIVES ${Math.max(lives, 0)}`, W - 14, H - 12);
  }

  // 오버레이
  if (state === 'title') {
    centerText('NEON', 160, 40, '#4fe3ff', '#4fe3ff');
    centerText('INVADERS', 210, 32, '#ff4fd8', '#ff4fd8');
    const f = Math.floor(t * 2) % 2;
    [2, 1, 0].forEach((ty, i) => {
      drawAlien(ty, W / 2 - 90, 270 + i * 44, f);
      ctx.font = `12px ${FONT}`; ctx.textAlign = 'left'; ctx.fillStyle = COL[ty];
      ctx.fillText(`= ${PTS[ty]} PTS`, W / 2 - 40, 288 + i * 44);
    });
    drawUfo({ x: W / 2 - 104, y: 270 + 3 * 44 });
    ctx.font = `12px ${FONT}`; ctx.textAlign = 'left'; ctx.fillStyle = '#ffb84f';
    ctx.fillText('= ??? PTS', W / 2 - 40, 288 + 3 * 44);
    if (Math.floor(t * 2) % 2) centerText('PRESS ENTER / TAP', 500, 14, '#e8f6ff');
  } else if (state === 'over') {
    ctx.fillStyle = 'rgba(5,4,15,.65)'; ctx.fillRect(0, 0, W, H);
    centerText('GAME OVER', 280, 32, '#ff4fd8', '#ff4fd8');
    centerText(`SCORE ${score}`, 330, 14);
    if (score > 0 && score >= hi) centerText('NEW HIGH SCORE!', 360, 12, '#ffb84f', '#ffb84f');
    if (overTimer <= 0 && Math.floor(t * 2) % 2) centerText('PRESS ENTER / TAP', 420, 12);
  } else if (state === 'clear') {
    centerText('WAVE CLEAR!', 290, 24, '#9dff4f', '#9dff4f');
    centerText(`LEVEL ${level + 1}`, 330, 14);
  } else if (paused) {
    ctx.fillStyle = 'rgba(5,4,15,.6)'; ctx.fillRect(0, 0, W, H);
    centerText('PAUSED', 310, 28, '#4fe3ff', '#4fe3ff');
  }
}

/* ---------- 입력 ---------- */
const KM = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', Space: 'fire', ArrowUp: 'fire', KeyW: 'fire' };
function tryStart() {
  if (state === 'title' || (state === 'over' && overTimer <= 0)) startGame();
}
addEventListener('keydown', e => {
  const k = KM[e.code];
  if (k) { keys[k] = true; e.preventDefault(); }
  if (e.code === 'Enter' || e.code === 'Space') tryStart();
  if (e.code === 'KeyP' && state === 'play') paused = !paused;
});
addEventListener('keyup', e => { const k = KM[e.code]; if (k) keys[k] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

cv.addEventListener('pointerdown', tryStart);
document.querySelectorAll('#touch button').forEach(btn => {
  const k = btn.dataset.k;
  const on = e => { e.preventDefault(); keys[k] = true; btn.classList.add('on'); tryStart(); };
  const off = e => { e.preventDefault(); keys[k] = false; btn.classList.remove('on'); };
  btn.addEventListener('pointerdown', on);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => btn.addEventListener(ev, off));
});

/* ---------- 루프 ---------- */
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.033);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
